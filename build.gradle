plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        roe {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'roe-gametest'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 1.21.11 ships obfuscated: use Mojang's own names, the same ones the code was written against.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Test-only. Never shipped in the mod jar (rule E20).
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}

// Rule E5: core/ is plain Java. Fails the build if it imports Minecraft, Mojang or Fabric.
tasks.register('checkCoreImports') {
    def coreDir = file('src/main/java/io/github/bl4z3es/riseofempires/core')
    inputs.dir(coreDir)
    doLast {
        def banned = ~/^\s*import\s+(static\s+)?(net\.minecraft|com\.mojang|net\.fabricmc)\./
        def bad = []
        coreDir.eachFileRecurse { f ->
            if (f.name.endsWith('.java')) {
                f.eachLine { line, n -> if (line =~ banned) bad << "${f.path}:${n}: ${line.trim()}" }
            }
        }
        if (!bad.isEmpty()) {
            throw new GradleException("Rule E5 broken: core/ must not import Minecraft, Mojang or Fabric classes.\n" + bad.join('\n'))
        }
    }
}
check.dependsOn 'checkCoreImports'
compileJava.dependsOn 'checkCoreImports'

// Plays the opening in the jar that is shipped, the way a player runs it: a real client, a normal
// generated world, the remapped jars, Fabric API from the mods list. Needs a display; on a machine
// without one run it as: xvfb-run -a ./gradlew runProdClientGameTest
// The release workflow runs this before it publishes anything. Pictures land in build/prodClient/screenshots.
tasks.register('gametestJar', Jar) {
    // Only the client test goes in: the in-world server tests are run by runGameTest.
    from(sourceSets.gametest.output) {
        include '**/OpeningPlaythroughTest*'
    }
    from 'src/gametest/prod'
    archiveClassifier = 'gametest-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = tasks.named('gametestJar').flatMap { it.archiveFile }
    classpath.from(sourceSets.gametest.compileClasspath)
    archiveClassifier = 'gametest'
    addNestedDependencies = false
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
tasks.register('runProdClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    runDir = layout.buildDirectory.dir('prodClient')
    mods.from(tasks.named('remapGametestJar'))
    jvmArgs.add('-Dfabric.client.gametest')
}
