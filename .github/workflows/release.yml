# Publishes a GitHub release with the mod jar when a release tag is pushed.
# The owner asked for one release after every milestone (2026-11-15): tags m1, m2, m3 ...
# Test builds between milestones use version tags such as v0.1.0-prealpha.
# A release published by hand on GitHub (Releases > Draft a new release) also gets the jar
# attached: the workflow builds the tagged commit and uploads to that release.
# A push that changes release/upload.txt (one line: a release tag) builds that commit and
# attaches its jar to that release, creating it as a pre-release if needed. Claude sessions use
# this, because they may push their branch but not tags.
name: Milestone release

on:
  push:
    tags:
      - 'm[0-9]*'
      - 'v[0-9]*'
    branches:
      - 'claude/**'
    paths:
      - 'release/upload.txt'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Loom needs Java 25 to run Gradle; the mod itself is compiled for Java 21.
      # The last version listed becomes JAVA_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Full build: compiles, runs the unit tests and the in-world game tests, and makes the jar.
      - name: Build and test
        run: ./gradlew build --no-daemon

      # The shipped jar in a real client and a normal world: join, the Hollow Ruin, founding, three days.
      # v0.1.0-prealpha froze every world on join and no other test could see it. Nothing is
      # published unless this passes.
      - name: Play the opening in the shipped jar
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runProdClientGameTest --no-daemon

      - name: Keep the pictures from the playthrough
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opening-playthrough
          path: |
            build/prodClient/screenshots
            build/prodClient/logs/latest.log
            build/prodClient/crash-reports
          if-no-files-found: ignore

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            TAG="$(head -1 release/upload.txt | tr -d '[:space:]')"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          JAR="$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)"
          MC="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          LOADER="$(grep '^loader_version=' gradle.properties | cut -d= -f2)"
          API="$(grep '^fabric_api_version=' gradle.properties | cut -d= -f2)"
          case "$TAG" in
            m[0-9]*) TITLE="Rise of Empires $(echo "$TAG" | tr '[:lower:]' '[:upper:]')"; KIND="Milestone $(echo "$TAG" | tr '[:lower:]' '[:upper:]') release." ;;
            *)       TITLE="Rise of Empires ${TAG} (test build)"; KIND="Test build ${TAG}. Expect bugs: it has passed the automated tests, including a scripted playthrough of the opening in a real client, but no person has played it." ;;
          esac
          cat > notes.md <<NOTES
          ${KIND}

          Requires Minecraft ${MC}, Fabric Loader ${LOADER} or newer, Fabric API ${API}, and Java 21.
          Put the jar in your \`mods\` folder together with Fabric API.

          See RELEASE_NOTES.md at this tag for what to try and what is known to be missing.
          NOTES
          if [ "${{ github.event_name }}" = "release" ] || gh release view "$TAG" >/dev/null 2>&1; then
            # Published by hand: keep its title and text, attach the jar and the install notes.
            gh release upload "$TAG" "$JAR" --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" "$JAR" --title "$TITLE" --notes-file notes.md --prerelease --target "${GITHUB_SHA}"
          fi

      # release/withdrawn.txt lists builds nobody should use (tag|reason). Say so on their pages.
      - name: Mark withdrawn releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f release/withdrawn.txt ] || exit 0
          while IFS='|' read -r OLD WHY; do
            case "$OLD" in ''|\#*) continue ;; esac
            gh release view "$OLD" >/dev/null 2>&1 || continue
            NAME="$(gh release view "$OLD" --json name --jq .name)"
            case "$NAME" in '[BROKEN]'*) continue ;; esac
            { printf '**Do not use this build.** %s\n\n---\n\n' "$WHY"; gh release view "$OLD" --json body --jq .body; } > withdrawn.md
            gh release edit "$OLD" --title "[BROKEN] $NAME" --notes-file withdrawn.md
          done < release/withdrawn.txt
