# Publishes a GitHub release with the mod jar when a milestone tag is pushed.
# The owner asked for one release after every milestone (2026-11-15). Tag names: m1, m2, m3 ...
name: Milestone release

on:
  push:
    tags:
      - 'm[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Full build: compiles, runs the unit tests and the in-world game tests, and makes the jar.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          MILESTONE="$(echo "$TAG" | tr '[:lower:]' '[:upper:]')"
          JAR="$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)"
          MC="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          LOADER="$(grep '^loader_version=' gradle.properties | cut -d= -f2)"
          API="$(grep '^fabric_api_version=' gradle.properties | cut -d= -f2)"
          cat > notes.md <<NOTES
          Rise of Empires, milestone ${MILESTONE}.

          Requires Minecraft ${MC}, Fabric Loader ${LOADER} or newer, Fabric API ${API}, and Java 21.
          Put the jar in your \`mods\` folder. What this milestone contains is in TASKS.md at this tag.
          NOTES
          gh release create "$TAG" "$JAR" --title "Rise of Empires ${MILESTONE}" --notes-file notes.md --prerelease
